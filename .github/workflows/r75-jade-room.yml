name: R7.5 Jade Room visual acceptance
on:
  push:
    branches: [feat/r75-table-visual-redesign, integration/r75-visual-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA and narrow UI change boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --name-only 641fedef77421acdb49eea1a9e390f46a5f68adb HEAD | while read -r path; do
            case "$path" in
              index.html|style.css|public/tiles/*.svg|src/table-ui/table.css|src/table-ui/view.js|src/table-ui/main.js|sw.js|tests/browser/r75-jade-room-gates.py|tests/browser/r75-tile-gallery.py|tests/browser/r75-table-presentation.test.js|.github/workflows/r75-jade-room.yml) ;;
              *) echo "::error::Unexpected change: $path"; exit 1 ;;
            esac
          done
      - run: node --test tests/tile-assets-integrity.test.js tests/browser/table-session.test.js tests/browser/r75-table-presentation.test.js tests/pwa/sw-transaction.test.js
      - name: Runtime graph
        run: |
          npm install --no-save --package-lock=false --ignore-scripts acorn@8.15.0
          node scripts/runtime-precache.mjs > graph.json
          node --input-type=module -e "import assert from 'node:assert/strict'; import {readFileSync} from 'node:fs'; const g=JSON.parse(readFileSync('graph.json')); assert.equal(g.sourceModules,74); assert.equal(g.shellAssets,120);"
  visual-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Install Traditional Chinese font for screenshot fidelity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK TC' | tee /tmp/tmt-font.txt
          grep -q 'NotoSansCJK' /tmp/tmt-font.txt
      - name: Actual Jade Room screenshots and geometry
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-sha.txt
          python tests/browser/r75-jade-room-gates.py --evidence evidence
      - name: Render complete 34-tile gallery
        run: python tests/browser/r75-tile-gallery.py --evidence evidence
      - name: Preserve existing mobile accessibility and keyboard gates
        run: python tests/browser/mobile-pwa-a11y-gates.py --evidence evidence/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-room-screenshots
          path: evidence/
          retention-days: 14
  offline-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Existing rollback and explicit update with real game history
        run: PHASE3_REQUIRE_SINGLE_WINNER=1 python tests/pwa/mobile-update-gates.py --with-game-history --evidence evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-room-offline-evidence
          path: evidence/
          retention-days: 14

  real-full-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p full-match-evidence
          git rev-parse HEAD > full-match-evidence/tested-sha.txt
      - name: Real full round, legal declarations, terminal replay and Daily offline
        run: PHASE3_REQUIRE_SINGLE_WINNER=1 python tests/browser/full-table-ui-r3-gates.py --screenshots full-match-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-room-full-match
          path: full-match-evidence/
          retention-days: 14

  full-native-regression:
    if: github.ref_name == 'integration/r75-visual-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RULES_REQUIRE_R73_SCORING: '1'
      SCORING_REQUIRE_R73_RULES: '1'
      REPLAY_REQUIRE_R73_AUTHORITATIVE: '1'
      STRATEGY_REQUIRE_RULES_INTEGRATION: '1'
      REPLAY_REQUIRE_R7_RULES: '1'
      REPLAY_REQUIRE_R7_SCORING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact candidate
        run: |
          set -euo pipefail
          mkdir -p r74-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > r74-evidence/tested-sha.txt
      - name: Full native suite
        run: |
          set -euo pipefail
          npm run check | tee r74-evidence/full-suite.tap
      - name: Mandatory authority and Academy tests (zero skips)
        run: |
          set -euo pipefail
          node --test tests/rules/r73-authoritative-settlement.test.js tests/scoring/pre-settlement.test.js tests/scoring/r73-rules-integration.test.js tests/replay/r73-authoritative-ledger.test.js tests/replay/r73-authoritative-replay.test.js tests/replay/r73-historical-settlement.test.js tests/replay/r73-mixed-history.test.js tests/academy/r73-scenario-flow.test.js tests/integration/master-academy-learning-adaptive.test.js tests/pwa/sw-transaction.test.js tests/integration/r74-authority-bot.test.js tests/integration/r74-authority-host.test.js tests/adaptive/schedule-storage.test.js tests/academy-ui-public.test.js tests/browser/table-session.test.js | tee r74-evidence/strict-suite.tap
          grep -Fxq '# skipped 0' r74-evidence/strict-suite.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r75-native-regression-evidence
          path: r74-evidence/
          retention-days: 14

  r73-seeded-ui:
    name: R7.5 fixed-seed real UI / ${{ matrix.difficulty }}
    if: github.ref_name == 'integration/r75-visual-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        difficulty: [Beginner, Intermediate, Advanced]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - run: google-chrome --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover genuine deterministic Rules scenarios (not browser evidence)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p r73-seeded-evidence
          git rev-parse HEAD > r73-seeded-evidence/tested-sha.txt
          node tests/browser/r73-seed-plans.mjs --difficulty "${{ matrix.difficulty }}" \
            --limit 12 --output r73-seeded-evidence/discovery.json
      - name: Explicit fixed seed via normal UI, independently replay all legal decisions
        run: |
          python tests/browser/r73-exact-origin-gate.py \
            --difficulty "${{ matrix.difficulty }}" --plans r73-seeded-evidence/discovery.json \
            --screenshots r73-seeded-evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r73-seeded-${{ matrix.difficulty }}
          path: r73-seeded-evidence
          if-no-files-found: error
          retention-days: 14

  r73-seeded-coverage:
    name: R7.5 observed seeded coverage across all difficulties
    if: always() && github.ref_name == 'integration/r75-visual-validation'
    needs: [r73-seeded-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r73-seeded-*
          path: r73-matrix
      - name: Require actual browser observations, never discovery-only results
        run: |
          python - <<'PY'
          import json, pathlib, os
          shas=list(pathlib.Path("r73-matrix").rglob("tested-sha.txt"))
          assert len(shas)==3 and all(p.read_text().strip()==os.environ["GITHUB_SHA"] for p in shas), "Seeded evidence SHA mismatch"
          reports=[json.loads(p.read_text()) for p in pathlib.Path('r73-matrix').rglob('r73-acceptance.json')]
          matches=[m for r in reports for m in r['matches'] if m['exactPlanVerified']]
          kinds={k for m in matches for k in m['humanActionKinds']}
          outcomes={m['outcome'] for m in matches}
          difficulties={m['difficulty'] for m in matches}
          missing=({'Beginner','Intermediate','Advanced'}-difficulties)|({'WIN','DRAW'}-outcomes)|({'replace_flower','chi','pong','kong','pass','win','discard','draw'}-kinds)
          result={'difficulties':sorted(difficulties),'outcomes':sorted(outcomes),'observedHumanKinds':sorted(kinds),'missing':sorted(missing),'matches':len(matches)}
          print('R73_MATRIX '+json.dumps(result))
          pathlib.Path('r73-matrix/coverage.json').write_text(json.dumps(result,indent=2))
          assert len(reports)==3 and not any(r['errors'] for r in reports) and not missing, 'Required real seeded coverage not observed: '+repr(missing)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r73-seeded-coverage-summary
          path: r73-matrix/coverage.json
          if-no-files-found: warn
          retention-days: 14
