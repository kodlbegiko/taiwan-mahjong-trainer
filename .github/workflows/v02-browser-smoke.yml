name: V0.2 browser smoke (staging only)
on:
  pull_request:
    branches: [main]
jobs:
  browser-smoke:
    if: github.head_ref == 'integration/v0.2-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser tooling (not a production dependency)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium desktop and 390px mobile smoke
        run: |
          node scripts/serve.js >/tmp/tmt-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs
      - name: Preserve viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-browser-smoke-images
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
