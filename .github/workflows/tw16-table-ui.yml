name: Phase 3 Table UI — sandbox legal actions, Chromium and offline
on:
  pull_request:
    paths:
      - 'src/table-ui/**'
      - 'tests/browser/full-table-ui-gates.py'
      - 'tests/browser/table-session.test.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/tw16-table-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-table:
    name: Table UI / legal action / persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/table-ui/main.js && node --check src/table-ui/session.js && node --check src/table-ui/view.js
      - run: node --test tests/browser/table-session.test.js
      - run: npm run check
  chromium-table:
    name: 320–1440px Chromium / offline / screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - run: google-chrome --version
      - name: Install Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Browser quality gate (formal full-game E2E is NOT_RUN)
        run: python tests/browser/full-table-ui-gates.py --screenshots tw16-table-evidence
      - name: Capture browser emulation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw16-table-ui-sandbox-evidence
          path: tw16-table-evidence
          retention-days: 14
