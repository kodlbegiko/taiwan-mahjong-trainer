name: R7.4 combined terminal acceptance
on:
  push:
    branches: [integration/r74-combined-terminal-candidate]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r74-combined-terminal-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-and-graph:
    if: github.ref_name == 'integration/r74-combined-terminal-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RULES_REQUIRE_R73_SCORING: '1'
      SCORING_REQUIRE_R73_RULES: '1'
      REPLAY_REQUIRE_R73_AUTHORITATIVE: '1'
      STRATEGY_REQUIRE_RULES_INTEGRATION: '1'
      REPLAY_REQUIRE_R7_RULES: '1'
      REPLAY_REQUIRE_R7_SCORING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact candidate
        run: |
          set -euo pipefail
          mkdir -p r74-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee r74-evidence/tested-sha.txt
      - name: Confirm exact tested commit and ownership boundary
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin integration/mahjong-full-game
          owner_head=HEAD
          if [[ "$GITHUB_REF_NAME" == 'integration/r74-combined-terminal-candidate' ]]; then
            owner_head=d7fdc5fbcb9073d41cf2ecb4b41a3286013ecb4b
            attestation_head=6b99b60f9c401c9bc5195027d55a7388328266ca
            git fetch --no-tags origin "$owner_head" "$attestation_head"
            git merge-base --is-ancestor d02eb508a0c302997f5e10a4eaf01c85bf0e6fb7 "$owner_head"
            for file in tests/browser/_release_site.py tests/pwa/mobile-update-gates.py; do
              git diff --exit-code "$owner_head" HEAD -- "$file"
            done
            # The candidate adds one attestation test to the exact owner suite.
            # Verify the pinned integration source AND preserve every owner byte.
            git diff --exit-code "$attestation_head" HEAD -- tests/pwa/sw-transaction.test.js
            git show "$owner_head:tests/pwa/sw-transaction.test.js" > "$RUNNER_TEMP/pwa-owner.js"
            python -c 'from pathlib import Path; import sys; assert Path("tests/pwa/sw-transaction.test.js").read_bytes().startswith(Path(sys.argv[1]).read_bytes()), "PWA owner test changed or removed"' "$RUNNER_TEMP/pwa-owner.js"
            echo "PWA_SOURCE_SHA=$owner_head" >> "$GITHUB_STEP_SUMMARY"
            echo "PWA_ATTESTATION_SOURCE_SHA=$attestation_head" >> "$GITHUB_STEP_SUMMARY"
          fi
          while IFS= read -r file; do
            case "$file" in
              index.html|style.css|sw.js|public/manifest.webmanifest|src/table-ui/table.css|src/table-ui/view.js|src/table-ui/a11y.js|tests/browser/mobile-pwa-a11y-gates.py|tests/pwa/mobile-update-gates.py|tests/pwa/sw-transaction.test.js|tests/browser/_release_site.py|docs/quality/R7_MOBILE_PWA_A11Y.md|.github/workflows/r7-mobile-pwa-a11y.yml|scripts/runtime-precache.mjs|.github/workflows/r7-runtime-precache.yml) ;;
              *) echo "::error::Out-of-scope file changed: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only origin/integration/mahjong-full-game..."$owner_head")
      - name: Full native suite
        run: |
          set -euo pipefail
          npm run check | tee r74-evidence/full-suite.tap
      - name: Mandatory authority and Academy tests (zero skips)
        run: |
          set -euo pipefail
          node --test tests/rules/r73-authoritative-settlement.test.js tests/scoring/pre-settlement.test.js tests/scoring/r73-rules-integration.test.js tests/replay/r73-authoritative-ledger.test.js tests/replay/r73-authoritative-replay.test.js tests/replay/r73-historical-settlement.test.js tests/replay/r73-mixed-history.test.js tests/academy/r73-scenario-flow.test.js tests/integration/master-academy-learning-adaptive.test.js tests/pwa/sw-transaction.test.js tests/integration/r74-authority-bot.test.js tests/integration/r74-authority-host.test.js tests/adaptive/schedule-storage.test.js tests/academy-ui-public.test.js tests/browser/table-session.test.js | tee r74-evidence/strict-suite.tap
          grep -Fxq '# skipped 0' r74-evidence/strict-suite.tap
      - name: Actual offline runtime graph
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts acorn@8.15.0
          node scripts/runtime-precache.mjs > r74-evidence/runtime-graph.json
          node --input-type=module -e "import assert from 'node:assert/strict'; import {readFileSync} from 'node:fs'; const g=JSON.parse(readFileSync('r74-evidence/runtime-graph.json')); assert.equal(g.sourceModules,74); assert.equal(g.shellAssets,120);"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-academy-native-evidence
          path: r74-evidence
          retention-days: 14
  academy-browser:
    if: github.ref_name == 'integration/r74-combined-terminal-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - name: Exact local Academy and scenario Daily
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p r74-academy-browser
          git rev-parse HEAD > r74-academy-browser/tested-sha.txt
          google-chrome --version
          python tests/browser/academy-combined-e2e.py --screenshots r74-academy-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-academy-browser-evidence
          path: r74-academy-browser
          retention-days: 14
  archive-browser:
    if: github.ref_name == 'integration/r74-combined-terminal-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - run: python -m playwright install --with-deps chromium
      - name: Real historical archive and authority cold-offline upgrade
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          old=0be7222cdd3020346c7a909c51e34cc7e6576099
          git worktree add --detach "$RUNNER_TEMP/r73-baseline" "$old"
          test "$(git -C "$RUNNER_TEMP/r73-baseline" rev-parse HEAD)" = "$old"
          mkdir -p r74-archive-browser
          git rev-parse HEAD > r74-archive-browser/tested-sha.txt
          python tests/replay/r73-browser-archive-gate.py --engine chromium --previous-tree "$RUNNER_TEMP/r73-baseline" --evidence r74-archive-browser/replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-archive-browser-evidence
          path: r74-archive-browser
          retention-days: 14

  mobile-full-match:
    if: github.ref_name == 'integration/r74-combined-terminal-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Verify exact source
        run: |
          set -euo pipefail
          mkdir -p r74-mobile-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > r74-mobile-evidence/tested-sha.txt
      - name: Responsive and accessibility checks
        run: python tests/browser/mobile-pwa-a11y-gates.py --evidence r74-mobile-evidence
      - name: Real legacy full match and offline
        run: PHASE3_REQUIRE_SINGLE_WINNER=1 python tests/browser/full-table-ui-r3-gates.py --screenshots r74-mobile-evidence/full-match
      - name: Real game and Daily history, rollback, explicit upgrade
        run: PHASE3_REQUIRE_SINGLE_WINNER=1 python tests/pwa/mobile-update-gates.py --with-game-history --evidence r74-mobile-evidence/upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-combined-mobile-evidence
          path: r74-mobile-evidence
          retention-days: 14

  r73-seeded-ui:
    name: R7.3 fixed-seed real UI / ${{ matrix.difficulty }}
    if: github.ref_name == 'integration/r74-combined-terminal-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        difficulty: [Beginner, Intermediate, Advanced]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - run: google-chrome --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover genuine deterministic Rules scenarios (not browser evidence)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p r73-seeded-evidence
          git rev-parse HEAD > r73-seeded-evidence/tested-sha.txt
          node tests/browser/r73-seed-plans.mjs --difficulty "${{ matrix.difficulty }}" \
            --limit 12 --output r73-seeded-evidence/discovery.json
      - name: Explicit fixed seed via normal UI, independently replay all legal decisions
        run: |
          python tests/browser/r73-exact-origin-gate.py \
            --difficulty "${{ matrix.difficulty }}" --plans r73-seeded-evidence/discovery.json \
            --screenshots r73-seeded-evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r73-seeded-${{ matrix.difficulty }}
          path: r73-seeded-evidence
          if-no-files-found: error
          retention-days: 14

  r73-seeded-coverage:
    name: R7.3 observed seeded coverage across all difficulties
    if: always() && github.ref_name == 'integration/r74-combined-terminal-candidate'
    needs: [r73-seeded-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r73-seeded-*
          path: r73-matrix
      - name: Require actual browser observations, never discovery-only results
        run: |
          python - <<'PY'
          import json, pathlib, os
          shas=list(pathlib.Path("r73-matrix").rglob("tested-sha.txt"))
          assert len(shas)==3 and all(p.read_text().strip()==os.environ["GITHUB_SHA"] for p in shas), "Seeded evidence SHA mismatch"
          reports=[json.loads(p.read_text()) for p in pathlib.Path('r73-matrix').rglob('r73-acceptance.json')]
          matches=[m for r in reports for m in r['matches'] if m['exactPlanVerified']]
          kinds={k for m in matches for k in m['humanActionKinds']}
          outcomes={m['outcome'] for m in matches}
          difficulties={m['difficulty'] for m in matches}
          missing=({'Beginner','Intermediate','Advanced'}-difficulties)|({'WIN','DRAW'}-outcomes)|({'replace_flower','chi','pong','kong','pass','win','discard','draw'}-kinds)
          result={'difficulties':sorted(difficulties),'outcomes':sorted(outcomes),'observedHumanKinds':sorted(kinds),'missing':sorted(missing),'matches':len(matches)}
          print('R73_MATRIX '+json.dumps(result))
          pathlib.Path('r73-matrix/coverage.json').write_text(json.dumps(result,indent=2))
          assert len(reports)==3 and not any(r['errors'] for r in reports) and not missing, 'Required real seeded coverage not observed: '+repr(missing)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r73-seeded-coverage-summary
          path: r73-matrix/coverage.json
          if-no-files-found: warn
          retention-days: 14
