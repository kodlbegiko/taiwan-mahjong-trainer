name: R7.4 isolated Adaptive diagnostic acceptance
on:
  push:
    branches: [integration/r74-adaptive-diagnostics-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-contract:
    if: github.ref_name == 'integration/r74-adaptive-diagnostics-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real persisted diagnostic contract (zero skips)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/adaptive/schedule-storage.test.js tests/academy-ui-public.test.js tests/integration/master-academy-learning-adaptive.test.js | tee "$RUNNER_TEMP/diagnostics.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/diagnostics.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-diagnostic-native
          path: ${{ runner.temp }}/diagnostics.tap
          retention-days: 14
