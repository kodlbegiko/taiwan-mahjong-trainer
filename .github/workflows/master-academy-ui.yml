name: Master Academy UI — canonical v3 and Chromium
on:
  pull_request:
    paths:
      - 'src/academy-ui/**'
      - 'src/app.js'
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'tests/browser/academy-ui-gates.py'
      - 'tests/browser/academy-learning-loop-gates.py'
      - 'tests/browser/academy-loop-fixture.js'
      - 'tests/browser/academy-loop-fixture.html'
      - 'tests/academy-ui-public.test.js'
      - '.github/workflows/master-academy-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-ui:
    name: Academy public boundary / canonical Node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/academy-ui/main.js && node --check src/academy-ui/public-facade.js && node --check src/academy-ui/scenario.js && node --check src/academy-ui/academy-bridge.js && node --check src/academy-ui/academy-live.js && node --check tests/browser/academy-loop-fixture.js
      - run: node --test tests/academy-ui-public.test.js
      - run: npm run check
  chromium-academy:
    name: Academy mobile / desktop / offline Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - run: google-chrome --version
      - name: Install readable Traditional Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real browser and offline validation (not device acceptance)
        run: python tests/browser/academy-ui-gates.py --screenshots academy-ui-evidence
      - name: Fixture-only Academy twelve-step UX, reload and denied storage
        run: python tests/browser/academy-learning-loop-gates.py --screenshots academy-ui-evidence
      - name: Upload screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-ui-browser-evidence
          path: academy-ui-evidence
          retention-days: 14
