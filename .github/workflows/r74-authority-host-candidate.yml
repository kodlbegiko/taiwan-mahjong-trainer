name: R7.4 isolated authority host acceptance
on:
  push:
    branches: [integration/r74-authority-host-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    if: github.ref_name == 'integration/r74-authority-host-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict actual authority host and legacy regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/integration/r74-authority-host.test.js tests/integration/r74-authority-bot.test.js tests/browser/table-session.test.js tests/integration/phase3-source-boundaries.test.js | tee "$RUNNER_TEMP/authority-host.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/authority-host.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-authority-host-native
          path: ${{ runner.temp }}/authority-host.tap
          retention-days: 14
