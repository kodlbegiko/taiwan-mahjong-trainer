name: Master Academy combined — real E2E & provenance gates
on:
  pull_request:
    paths:
      - 'src/rules/**'
      - 'src/strategy/**'
      - 'src/academy/**'
      - 'src/adaptive/**'
      - 'src/academy-ui/**'
      - 'src/integration/**'
      - 'data/academy/**'
      - 'sw.js'
      - 'index.html'
      - 'tests/integration/master-academy-*'
      - 'tests/browser/academy-combined-e2e.py'
      - '.github/workflows/master-academy-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-node:
    name: R/S/L/A, Golden & both 10k Oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required full unit and integration suite
        run: STRATEGY_REQUIRE_RULES_INTEGRATION=1 npm run check
      - name: Mandatory real Rules Engine + Strategy same HEAD
        run: STRATEGY_REQUIRE_RULES_INTEGRATION=1 node --test tests/strategy/rules-engine.integration.test.js
      - name: Mandatory live Learning + Adaptive provenance failures and recovery
        run: node --test tests/integration/master-academy-learning-adaptive.test.js
  real-chromium:
    name: Real Lesson / v3 / Adaptive / review / offline 390 & 1440
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0'
      - run: google-chrome --version
      - name: Verify real 12-step Academy path and failure handling
        run: python tests/browser/academy-combined-e2e.py --screenshots academy-combined-evidence
      - name: Save real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-combined-real-e2e
          path: academy-combined-evidence
          retention-days: 14
