name: R7.4 authority blocked-checkpoint regression
on:
  push:
    branches: [integration/r74-authority-block-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-native:
    if: github.ref_name == 'integration/r74-authority-block-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact real authority controller host regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/integration/r74-authority-host.test.js tests/integration/r74-authority-bot.test.js tests/browser/table-session.test.js | tee "$RUNNER_TEMP/block.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/block.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-block-native
          path: ${{ runner.temp }}/block.tap
          retention-days: 14
  browser:
    if: github.ref_name == 'integration/r74-authority-block-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: |
          mkdir -p r74-authority-browser
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > r74-authority-browser/tested-sha.txt
          python tests/browser/r74-authority-local-gate.py --evidence r74-authority-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r74-block-browser
          path: r74-authority-browser
          retention-days: 14
